<svg xmlns="http://www.w3.org/2000/svg" viewBox="-105 -105 210 210" width="64" height="64" role="img" aria-label="NOVAIRA">
  <title>NOVAIRA</title>
  <defs>
    <linearGradient id="g" x1="-1" y1="-1" x2="1" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F2EEE8"/>
      <stop offset="28%" stop-color="#E8C99A"/>
      <stop offset="50%" stop-color="#C4956A"/>
      <stop offset="72%" stop-color="#D4A87A"/>
      <stop offset="100%" stop-color="#EDE4D4"/>
    </linearGradient>
  </defs>
  <!-- Ink ground so the favicon reads consistently against any browser chrome -->
  <rect x="-105" y="-105" width="210" height="210" rx="28" ry="28" fill="#09070A"/>
  <!-- Interior fill — barely there, adds body at larger sizes -->
  <path d="M 78.286,-62.220 A 100,100 0 1 0 78.286,62.220 A 80,80 0 1 1 78.286,-62.220 Z" fill="rgba(196,149,106,0.08)"/>
  <!-- Outer arc — primary stroke -->
  <path d="M 78.286,-62.220 A 100,100 0 1 0 78.286,62.220" stroke="url(#g)" stroke-width="16" fill="none" stroke-linecap="round"/>
  <!-- Inner arc — softer, gives the crescent its body -->
  <path d="M 78.286,-62.220 A 80,80 0 1 1 78.286,62.220" stroke="url(#g)" stroke-width="11" fill="none" stroke-linecap="round" opacity="0.72"/>
  <!-- Tip accents — the brand's punctuation. These survive compression. -->
  <circle cx="78.286" cy="-62.220" r="16" fill="#F2EEE8" opacity="0.95"/>
  <circle cx="78.286" cy="62.220" r="16" fill="#EDE4D4" opacity="0.88"/>
</svg>
